nd to keep the stage about music - not divisive political propaganda.\u003c/p\u003e","mandatory":true,"options_order":"custom","labelsPositions":{},"display":"dropdown","forceRequired":false,"answerConstraints":[],"pageBlockId":"page_blockfixo4kdk"},"page_blockfixo4kdk":{"type":"PageBlock"}},"formTitle":"IAC CALL TO ACTION :                                                              Ed Sheeran - Your Show. Your Stage. Your Responsibility!","show_name_question":true,"syncQuestionAndColumnsTitles":true,"sortedQuestionsList":["page_blockfixo4kdk","name","emailu2l5hzri","location3w5e1haf","single_selectfa4jz2m"],"createdBy":13471840,"formOwnerId":13471840,"canFormOwnerCreateAssets":true,"isManagedTemplate":false,"migratedToPageBlocks":true,"oldSortedQuestionsList":["page_block__classic_default","name"],"formLogoPath":"https://d33zzd4k5u0xj2.cloudfront.net/us-east-1/workforms-form-logos/16b75f53-ce72-4016-a9df-72e08d474bb9_11c3b9","showWelcomeView":true,"welcomeViewDescription":"\u003cp\u003e\u003cstrong\u003eDear Ed Sheeran,\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eStuart Camp / Grumpy Old Management,\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMessina Touring Group / AEG Presents,\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eand MetLife Stadium Leadership\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eand the leadership of all venues hosting the LOOP Tour,\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003eAt \u003cstrong\u003eEd Sheeran’s September 4 concert at MetLife Stadium in New Jersey\u003c/strong\u003e, opening act Macklemore used the stage to deliver an extended political message, called for “Free Palestine” and performed \u003cem\u003eHind’s Hall\u003c/em\u003e while images from Gaza and other political messaging were projected across the stadium screens.\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThis was an Ed Sheeran concert - not a political rally, not a protest, and not an activist event.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003eThe issue is not whether Macklemore has the right to hold political views. The question is \u003cstrong\u003ewhere the line should be drawn when an opening act uses a global concert platform to advance a one-sided political agenda.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003eThis becomes even more troubling when the message relies on \u003cstrong\u003eselective imagery, biased messaging, and disputed claims presented to a massive audience as fact\u003c/strong\u003e, without context or complexity.\u003c/p\u003e\u003cp\u003eThe decision to perform \u003cem\u003eHind’s Hall\u003c/em\u003e was not incidental. The song was written in explicit support of the campus protest movement and takes its name from “Hind’s Hall” the name protesters gave Columbia University’s Hamilton Hall after occupying the building.\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003eSome of those protests involved trespassing, building occupations, vandalism, disruption of university operations, and violations of the law - \u003cstrong\u003econduct that stands in direct conflict with core American values, including the rule of law, open discourse, respect for institutions, and shared civic space.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://www.columbiaspectator.com/resizer/v2/TSGZZIE3GFCYLBIEWWIQTWO3UI.jpg?auth=eda8257e298ba9b93998dac55f978e538f1f2b047444af5ddb9896ae7a97c7b7\u0026amp;width=1200\" width=\"452\" height=\"301.333\" /\u003e\u003c/p\u003e\u003cp\u003e (By Gabriella Gregor Splaver 2024 )\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003eWe call on Ed Sheeran, tour leadership, and the leadership of all venues hosting the Tour to:\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e﻿Remove Macklemore from the remaining LOOP Tour dates on which he is scheduled to appear.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWe also call on tour leadership to clarify whether Macklemore’s political speech, visual content, and performance of \u003cem\u003eHind’s Hall\u003c/em\u003e were approved in advance, and to establish clear boundaries for the use of the tour stage to promote political messaging.\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFreedom of expression does not mean freedom from responsibility.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eYour show. Your stage. Your responsibility.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eKeep Ed Sheeran’s LOOP Tour about music - not political propaganda.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e**By submitting this form, I agree to receive action alerts, updates, and communications from the Israeli-American Council (IAC)*\u003c/em\u003e\u003c/p\u003e","welcomeViewTitle":"IAC petition: Ed Sheeran - Your Show. Your Stage. Your Responsibility!","conditionalRules":{},"formDescription":"\u003cp\u003ePlease sign this petition calling on Ed Sheeran, LOOP Tour leadership, and all venues hosting the tour to remove Macklemore from the September 5 MetLife Stadium show and future dates, and to keep the concert stage a space for music that brings people together - not one-sided political propaganda that divides them.\u003c/p\u003e","formPrimaryColor":"#80c2df","is_survey":true,"hideMondayLogo":false,"shorten_url_checked":true,"shorten_url":"https://wkf.ms/4zSwa5D","formFormat":"one-by-one","formLayout":"full-right","formLayoutType":"flat"},"board_view_id":183413773,"region":"use1","features":{"workforms_connected_boards_column":true,"workforms_edit_submission":false,"workforms_draft_submission":true,"workforms_submit_form_throu
